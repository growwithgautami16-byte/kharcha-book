<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kharcha Book</title>
<meta name="theme-color" content="#0F4C5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kharcha">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>

/* Layout: one narrow ledger column. Month and totals first, then budget lines, then quick add, then the entries. */
:root{
  --bg:#F4F8F7; --surface:#FFFFFF; --fg:#1F2A30; --muted:#566A6F; --line:#D3E0DF; --tint:#E6F0EF;
  --accent:#0F4C5C; --accent-fg:#FFFFFF; --warm:#A3440A;
  --ok:#2E7D5B; --warn:#A8690A; --bad:#B3261E;
  --display:'Fraunces',Georgia,serif; --body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101A1D; --surface:#172428; --fg:#E6EEEE; --muted:#9DB0B3; --line:#2B3E43; --tint:#1E3236;
  --accent:#6CC1D1; --accent-fg:#0B1F24; --warm:#F0A06B; --ok:#6FCF9F; --warn:#E5B567; --bad:#F2877F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101A1D; --surface:#172428; --fg:#E6EEEE; --muted:#9DB0B3; --line:#2B3E43; --tint:#1E3236;
  --accent:#6CC1D1; --accent-fg:#0B1F24; --warm:#F0A06B; --ok:#6FCF9F; --warn:#E5B567; --bad:#F2877F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:34px;color:var(--accent)}
h2{font-size:20px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warm)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.months{display:flex;align-items:center;gap:6px}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;font-size:18px;line-height:1}
.monthname{min-width:130px;text-align:center;font-weight:700}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.tot b{display:block;font-family:var(--display);font-size:26px;margin-top:2px}
.tot.dark{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tot.dark .label{color:inherit;opacity:.85}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.link{background:none;border:none;color:var(--accent);font-weight:600;padding:4px 0;text-decoration:underline}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.bar .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--tint);overflow:hidden}
.bar .fill{height:100%;border-radius:4px;background:var(--accent)}
.bar.warn .fill{background:var(--warn)} .bar.over .fill{background:var(--bad)}
.bar .sub{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.bar input{width:96px;text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--bg);padding:9px 6px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.primary{background:var(--warm);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:700}
.primary:disabled{opacity:.6;cursor:default}
.msg{font-size:13.5px;min-height:1.2em}
.msg.err{color:var(--bad)}
.day{display:flex;flex-direction:column}
.dayhead{font-size:12.5px;font-weight:700;color:var(--muted);padding:8px 0 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.row .what{font-weight:600;overflow-wrap:anywhere}
.row .meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row .amt{font-weight:700;text-align:right}
.row .acts{grid-column:2;text-align:right;font-size:13px}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:700;background:var(--tint);color:var(--accent);margin-right:6px}
.empty{padding:22px 4px;color:var(--muted);text-align:center}
.summary{white-space:pre-wrap;background:var(--tint);border-radius:8px;padding:12px 14px}
.banner{background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px}
.confirm button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 10px;margin-left:6px}
.confirm button.yes{background:var(--bad);color:#fff;border-color:var(--bad)}

html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
input,select{font-size:16px} /* stops iPhone zooming into fields */
.login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
.login .panel{gap:14px}
.whoami{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.offline{background:var(--warn);color:#fff;border-radius:8px;padding:8px 12px;font-size:13.5px}
</style>
</head>
<body>

<div class="login" id="loginview" hidden>
  <div>
    <div class="label">Akash and Gautami</div>
    <h1>Kharcha Book</h1>
  </div>
  <form class="panel" id="loginform" autocomplete="on">
    <label class="field"><span>Email</span><input id="email" type="email" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" id="loginbtn" type="submit">Sign in</button>
    <span class="msg" id="loginmsg" role="status"></span>
  </form>
</div>

<div class="wrap" id="appview" hidden>
  <div class="top">
    <div>
      <div class="label">Akash and Gautami</div>
      <h1>Kharcha Book</h1>
    </div>
    <div class="months">
      <button class="ibtn" id="prev" aria-label="Previous month">&#8249;</button>
      <div class="monthname" id="monthname"></div>
      <button class="ibtn" id="next" aria-label="Next month">&#8250;</button>
    </div>
  </div>

  <div id="offline" class="offline" hidden>You're offline. New entries will sync when you're connected again.</div>

  <div class="totals" id="totals"></div>

  <section class="panel" aria-labelledby="ah">
    <h2 id="ah">Add an expense</h2>
    <form id="form" class="form" autocomplete="off">
      <label class="field"><span>Amount (₹)</span><input id="amount" type="number" inputmode="decimal" min="1" step="any" placeholder="450" required></label>
      <label class="field"><span>Category</span><select id="category"></select></label>
      <label class="field"><span>Date</span><input id="date" type="date" required></label>
      <div class="field" style="grid-column:1/-1"><span>Paid from</span>
        <div class="seg" id="paid">
          <button type="button" data-v="Joint account" aria-pressed="true">Joint account</button>
          <button type="button" data-v="Gautami" aria-pressed="false">Gautami</button>
          <button type="button" data-v="Akash" aria-pressed="false">Akash</button>
        </div>
      </div>
      <label class="field" style="grid-column:1/-1"><span>Note (optional)</span><input id="note" type="text" maxlength="120" placeholder="Vegetables from the market"></label>
      <div style="grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <button class="primary" id="addbtn" type="submit">Add expense</button>
        <span class="msg" id="addmsg" role="status"></span>
      </div>
    </form>
  </section>

  <section class="panel" aria-labelledby="bh">
    <div class="panelhead">
      <h2 id="bh">Budget lines</h2>
      <button class="link" id="editbudgets" type="button">Edit budgets</button>
    </div>
    <div id="bars" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>

  <section class="panel" aria-labelledby="eh">
    <div class="panelhead">
      <h2 id="eh">This month's entries</h2>
      <button class="link" id="sumbtn" type="button" hidden>Month summary</button>
    </div>
    <div id="summary" class="summary" hidden></div>
    <div id="list"></div>
  </section>

  <div class="whoami"><span id="who"></span><button class="link" id="signout" type="button">Sign out</button></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
